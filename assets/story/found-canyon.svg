<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="t d">
  <title id="t">Nine open blocks and one tall narrow block</title>
  <desc id="d">Nine of ten blocks can take open-top trees. One block is too tall and narrow.</desc>
  <rect width="360" height="200" fill="#fff"/>
  <g fill="#346538">
    <rect x="24" y="88" width="24" height="48"/>
    <rect x="54" y="80" width="24" height="56"/>
    <rect x="84" y="92" width="24" height="44"/>
    <rect x="114" y="76" width="24" height="60"/>
    <rect x="144" y="86" width="24" height="50"/>
    <rect x="174" y="90" width="24" height="46"/>
    <rect x="204" y="78" width="24" height="58"/>
    <rect x="234" y="88" width="24" height="48"/>
    <rect x="264" y="84" width="24" height="52"/>
  </g>
  <rect x="306" y="48" width="28" height="88" fill="#9f2f2d"/>
  <text x="24" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#346538">9 open</text>
  <text x="306" y="168" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9f2f2d">1 tall</text>
</svg>
