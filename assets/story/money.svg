<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d">
  <title id="t">Income here versus the city, and heat risk</title>
  <desc id="d">Typical household income is $15,510 here and about $31,238 citywide. Heat risk is 5 of 5.</desc>
  <rect width="360" height="240" fill="#fff"/>
  <rect x="48" y="88" width="92" height="72" fill="#f3f2ef"/>
  <rect x="160" y="48" width="92" height="112" fill="#eaeaea"/>
  <text x="94" y="178" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111">$15,510</text>
  <text x="94" y="196" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#787774">here</text>
  <text x="206" y="178" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111">$31,238</text>
  <text x="206" y="196" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#787774">city</text>
  <text x="300" y="100" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#9f2f2d">5/5</text>
  <text x="300" y="122" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#787774">heat</text>
</svg>
